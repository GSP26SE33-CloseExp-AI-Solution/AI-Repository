version: '3.8'

services:
  ai-service:
    build: .
    container_name: closeexp-ai-service
    ports:
      - "8000:8000"
    environment:
      - AI_APP_NAME=CloseExp AI Service
      - AI_APP_VERSION=1.0.0
      - AI_ENVIRONMENT=development
      - AI_DEBUG=true
      - AI_LOG_LEVEL=DEBUG
      - AI_LOG_FORMAT=console
      - AI_API_KEY=${AI_API_KEY:-dev-api-key-for-testing}
      - AI_API_KEY_HEADER=X-API-Key
      - AI_ALLOWED_ORIGINS=http://backend:5000,http://localhost:5000,http://localhost:3000
      - AI_YOLO_MODEL_PATH=yolo11n.pt
    volumes:
      - ./models:/app/models:ro
      - ./runs:/app/runs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - closeexp-network

